<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito+Sans:opsz,wght@6..12,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css"
      integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPdFgmx8xqexRcpAglTj9sIBWINXa8x5w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Systementor Zoo</title>
  </head>
  <body>
    <header class="header">
      <div class="container header-container">
        <a class="header-link" href="index.html"
          ><img
            class="header-link-logo"
            src="images/logo.png"
            alt="Systementor Zoo"
            width="120"
        /></a>
        <nav class="header-nav">
          <ul class="header-list">
            <li class="header-item">
              <a class="header-nav-link" href="#animals">Våra djur</a>
            </li>
            <li class="header-item">
              <a class="header-nav-link" href="#about">Om oss</a>
            </li>
            <li class="header-item">
              <a class="header-nav-link" href="#visit">Hitta hit</a>
            </li>
          </ul>
        </nav>

        <button type="button" class="burger-menu" aria-label="Open menu">
          <svg class="burger-menu-svg" width="32" height="32">
            <use href="icons.svg#icon-burger-menu"></use>
          </svg>
        </button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="container">
          <h1 class="hero-title">
            <span class="hero-title-span">Välkommen till</span>
            hösten på Systementor Zoo
          </h1>
          <div class="hero-box-clock">
            <svg class="hero-svg" aria-hidden="true" width="28" height="28">
              <use href="icons.svg#icon-clock"></use>
            </svg>
            <p class="hero-text">Öppet varje dag 10:00 - 17:00</p>
          </div>
          <a class="hero-link" href="#visit">Boka biljett</a>
        </div>
      </section>
      <div class="hero-info"></div>
    </main>
    <footer></footer>
  </body>
</html>
